<div class="flex flex-col items-center gap-2">
  <div class="block md-typescale-body-medium md-sys-color-on-surface mt-4 text-center">
    <span>Room Code</span>
  </div>

  <app-input-otp
    [length]="length"
    [integerOnly]="false"
    [placeholder]="placeholder"
    [ariaLabel]="ariaLabel"
    [disabled]="inner.disabled"
    [formControl]="inner"
    (complete)="onOtpComplete()"
    data-testid="room-code-otp"
  ></app-input-otp>
</div>
