<form [formGroup]="form" class="flex flex-col gap-4 w-full max-w-md mx-auto" novalidate>
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>New Player Name</mat-label>
    <mat-icon matPrefix fontIcon="person" class="mr-2" aria-hidden="true"></mat-icon>
    <input
      matInput
      formControlName="newPlayerName"
      (keydown.enter)="onCheck()"
      data-testid="new-player-name-input"
      aria-label="New player name"
    />
  </mat-form-field>

  <div class="flex gap-2 items-center justify-center">
    <button
      matButton="outlined"
      color="primary"
      type="button"
      (click)="onCheck()"
      [disabled]="disabledCheck"
      data-testid="check-name-availability"
      aria-label="Check name availability"
    >
      <mat-icon fontIcon="search" class="mr-2" aria-hidden="true"></mat-icon>
      Check Name Availability
    </button>

    <mat-progress-spinner
      *ngIf="nameCheck.pending"
      mode="indeterminate"
      [diameter]="20"
      aria-label="Checking name availability"
      role="status"
    ></mat-progress-spinner>
  </div>

  <div aria-live="polite" class="text-center">
    <div *ngIf="showAvailable" class="md-sys-color-secondary md-typescale-body-small" data-testid="name-available">
      This name is available!
    </div>
    <div *ngIf="showUnavailable" class="md-sys-color-error md-typescale-body-small" data-testid="name-unavailable">
      This name is already taken. Please choose another one.
    </div>
    <div *ngIf="nameCheck.error" class="md-sys-color-error md-typescale-body-small" data-testid="name-check-error">
      {{ nameCheck.error }}
    </div>
  </div>

  <div class="flex gap-2 justify-center mt-2">
    <button
      matButton="outlined"
      color="primary"
      type="button"
      (click)="onBack()"
      [disabled]="isBusy"
      data-testid="new-person-back"
      aria-label="Back"
    >
      <mat-icon fontIcon="arrow_back" class="mr-2" aria-hidden="true"></mat-icon>
      Back
    </button>

    <button
      matButton="filled"
      color="primary"
      type="button"
      (click)="onCreate()"
      [disabled]="disabledCreate"
      data-testid="create-new-player"
      aria-label="Create new player"
    >
      <mat-icon fontIcon="person_add" class="mr-2" aria-hidden="true"></mat-icon>
      Create New Player
    </button>
  </div>
</form>
