<form
  [formGroup]="form"
  class="flex flex-col gap-4 w-full max-w-md mx-auto"
  novalidate
  (submit)="$event.preventDefault()"
  (keydown.enter)="$event.preventDefault()"
>
  <div aria-live="polite" class="text-center mt-3">
    <div
      *ngIf="showUnavailable"
      class="md-sys-color-error md-typescale-body-small"
      data-testid="name-unavailable"
    >
      This name is already taken. Please choose another one.
    </div>
    <div
      *ngIf="nameCheck.error"
      class="md-sys-color-error md-typescale-body-small"
      data-testid="name-check-error"
    >
      {{ nameCheck.error }}
    </div>
  </div>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Username (Format: j.smith)</mat-label>
    <mat-icon matPrefix aria-hidden="true">person</mat-icon>
    <input
      matInput
      formControlName="newPlayerName"
      (keydown.enter)="onCheck()"
      data-testid="new-player-name-input"
      aria-label="New username"
    />
  </mat-form-field>

  <!-- Required PIN for new person -->
  <div class="flex flex-col items-center gap-2">
    <div>Create a new 4-digit PIN</div>
    <app-input-otp
      [length]="4"
      [integerOnly]="true"
      formControlName="pin"
      aria-label="4-digit PIN"
      data-testid="new-person-pin-otp"
    ></app-input-otp>

    <div
      *ngIf="form.controls.pin.touched && form.controls.pin.invalid"
      class="md-sys-color-error md-typescale-body-small text-center"
      role="alert"
    >
      {{ fieldError(form.controls.pin) }}
    </div>
  </div>
  <div class="flex gap-2 items-center justify-center mt-4">
    <button
      matButton="outlined"
      color="primary"
      type="button"
      (click)="onCheck()"
      [disabled]="disabledCheck"
      data-testid="check-name-availability"
      aria-label="Check name availability"
    >
      <mat-icon aria-hidden="true">search</mat-icon>
      Check Name Availability
    </button>

    <mat-progress-spinner
      *ngIf="nameCheck.pending"
      mode="indeterminate"
      [diameter]="20"
      aria-label="Checking name availability"
      role="status"
    ></mat-progress-spinner>
  </div>
  <div
    *ngIf="showAvailable"
    class="md-sys-color-secondary md-typescale-body-small text-center"
    data-testid="name-available"
  >
    This name is available!
  </div>
  <div class="flex gap-2 justify-center mt-2">
    <button
      matButton="outlined"
      color="primary"
      type="button"
      (click)="onBack()"
      [disabled]="isBusy"
      data-testid="new-person-back"
      aria-label="Back"
    >
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      Back
    </button>

    <button
      matButton="filled"
      color="primary"
      type="button"
      (click)="onCreate()"
      [disabled]="disabledCreate"
      data-testid="create-new-player"
      aria-label="Create new player"
    >
      <mat-icon aria-hidden="true">person_add</mat-icon>
      Create New Player
    </button>
  </div>
</form>
