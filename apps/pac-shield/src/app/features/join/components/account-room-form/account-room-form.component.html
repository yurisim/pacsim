<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6" novalidate>
  <!-- Room Code -->
  <div class="flex flex-col items-center gap-2">
    <div class="block md-typescale-body-medium md-sys-color-on-surface mt-4 text-center">
      <span>Room Code</span>
    </div>

    <app-input-otp
      [length]="6"
      [integerOnly]="false"
      formControlName="gameId"
      ariaLabel="6-character Room Code"
      (complete)="onOtpComplete($event)"
      data-testid="room-code-otp"
    ></app-input-otp>

    <div class="h-6 flex items-center justify-center gap-2 mt-2 transition-all duration-300 ease-out" [attr.aria-live]="'polite'" [attr.id]="roomMessageId">
      <mat-progress-spinner
        *ngIf="isRoomPending"
        mode="indeterminate"
        [diameter]="16"
        class="animate-in fade-in-0 zoom-in-95 duration-200"
        role="status"
        aria-label="Validating room code"
      ></mat-progress-spinner>

      <mat-icon
        *ngIf="isRoomValid && !isRoomPending"
        fontIcon="check_circle"
        class="md-sys-color-secondary animate-in fade-in-0 zoom-in-50 duration-400"
        aria-hidden="true"
      ></mat-icon>

      <mat-icon
        *ngIf="isRoomInvalid && !isRoomPending"
        fontIcon="cancel"
        class="md-sys-color-error animate-in fade-in-0 zoom-in-50 duration-400"
        aria-hidden="true"
      ></mat-icon>

      <span *ngIf="isRoomInvalid && roomStatus.message" class="md-typescale-body-small md-sys-color-error">
        {{ roomStatus.message }}
      </span>
    </div>
  </div>

  <!-- Player Name (shown after room is valid) -->
  <div *ngIf="isRoomValid">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Player Name</mat-label>
      <mat-icon matPrefix fontIcon="person" class="mr-2" aria-hidden="true"></mat-icon>
      <input
        matInput
        formControlName="playerName"
        [attr.aria-describedby]="nameErrorId"
        (input)="onPlayerNameInput(form.controls.playerName.value)"
        (keydown.enter)="onSubmit()"
        data-testid="player-name-input"
      />
    </mat-form-field>
    <div
      *ngIf="form.controls.playerName.invalid && form.controls.playerName.touched"
      class="md-typescale-body-small md-sys-color-error mt-1"
      [attr.id]="nameErrorId"
      aria-live="polite"
    >
      {{ fieldError(form.controls.playerName) }}
    </div>
  </div>

  <!-- Submit -->
  <div class="flex gap-3 justify-center mt-2">
    <button
      matButton="filled"
      color="primary"
      type="submit"
      [disabled]="isBusy || !canSubmit || form.pending"
      data-testid="join-submit-button"
      aria-label="Join game"
    >
      <mat-icon
        [fontIcon]="isBusy ? 'hourglass_top' : isRoomPending ? 'autorenew' : 'login'"
        class="mr-2"
        aria-hidden="true"
      ></mat-icon>
      <span class="md-typescale-label-large">
        {{ isBusy ? 'Joining...' : isRoomPending ? 'Validating...' : 'Join' }}
      </span>
    </button>
  </div>
</form>
