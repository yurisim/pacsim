<form [formGroup]="form" class="flex flex-col gap-6" novalidate (submit)="$event.preventDefault()" (keydown.enter)="$event.preventDefault()">
  <!-- Room Code -->
  <div class="flex flex-col items-center gap-2">
    <div class="block md-typescale-body-medium md-sys-color-on-surface mt-4 text-center">
      <span>Room Code</span>
    </div>

    <app-room-code-field
      formControlName="gameId"
      [length]="6"
      ariaLabel="6-character Room Code"
      (complete)="onRoomCodeComplete()"
      data-testid="room-code-otp"
    ></app-room-code-field>

    <app-status-banner
      [attr.id]="roomMessageId"
      [state]="roomStatus.status === 'pending' ? 'checking' : roomStatus.status === 'valid' ? 'valid' : roomStatus.status === 'invalid' ? 'invalid' : 'idle'"
      [message]="roomStatus.message"
    ></app-status-banner>
  </div>

  <!-- Player Name (shown after room is valid) -->
  <div *ngIf="isRoomValid">
    <div class="flex gap-2 items-start">
      <div class="flex-1">
        <app-account-selector
          [selectedAccount]="{ name: form.controls.playerName.value || '' }"
          [disabled]="false"
          [ariaDescribedById]="nameErrorId"
          [errorText]="form.controls.playerName.invalid && form.controls.playerName.touched ? fieldError(form.controls.playerName) : null"
          (accountChange)="onAccountChange($event)"
        ></app-account-selector>
      </div>
      <button
        matButton="outlined"
        type="button"
        (click)="onCheckNameClick()"
        [disabled]="!canCheckName()"
        class="mt-2"
        data-testid="check-name-button"
      >
        <mat-icon aria-hidden="true">{{nameAvailable === undefined && isBusy ? 'hourglass_top' : 'search'}}</mat-icon>
        <span>{{nameAvailable === undefined && isBusy ? 'Checking...' : 'Check Name'}}</span>
      </button>
    </div>

    <!-- Minimal name availability messaging (optional UX) -->
    <div
      class="mt-2 text-center md-typescale-body-small md-sys-color-on-surface-variant"
      data-testid="account-name-availability"
      aria-live="polite"
    >
      <ng-container *ngIf="nameAvailable === true">
        <span class="text-green-600">Name available</span>
      </ng-container>
      <ng-container *ngIf="nameAvailable === false">
        <span class="text-red-600">This name is already in use</span>
      </ng-container>
    </div>

    <!-- PIN is shown only when room is valid AND name is available -->
    <div *ngIf="nameAvailable === true" class="flex flex-col items-center gap-2 mt-4">
      <app-input-otp
        [length]="4"
        [integerOnly]="true"
        formControlName="pin"
        aria-label="4-digit PIN"
        data-testid="account-pin-otp"
      ></app-input-otp>

      <small class="block text-center md-typescale-body-small md-sys-color-on-surface-variant">
        Create a 4-digit PIN to secure your name for future sessions.
      </small>

      <!-- Show validation when field is touched and invalid (required or wrong length) -->
      <div
        *ngIf="form.controls.pin.touched && form.controls.pin.invalid"
        class="md-sys-color-error md-typescale-body-small text-center"
        role="alert"
      >
        {{ fieldError(form.controls.pin) }}
      </div>
    </div>
  </div>

  <!-- Submit -->
  <div class="flex gap-3 justify-center mt-2">
    <button
      matButton="filled"
      color="primary"
      type="button"
      (click)="onSubmit()"
      [disabled]="isBusy || !canSubmit || form.pending || form.invalid"
      data-testid="join-submit-button"
      aria-label="Join game"
    >
      <mat-icon
        aria-hidden="true"
      >{{isBusy ? 'hourglass_top' : isRoomPending ? 'autorenew' : 'login'}}</mat-icon>
      <span class="md-typescale-label-large">
        {{ isBusy ? 'Joining...' : isRoomPending ? 'Validating...' : 'Join' }}
      </span>
    </button>
  </div>
</form>
