<div class="flex justify-center items-center h-[calc(100vh-100px)]">
  <p-card header="Join Game" class="w-[400px] text-center">
    <div [formGroup]="joinForm" class="flex flex-col gap-4">
      <p-inputgroup>
        <p-inputgroup-addon>
          <i class="pi pi-key"></i>
        </p-inputgroup-addon>
        <input pInputText formControlName="gameId" placeholder="Room Code" />
      </p-inputgroup>
      <div *ngIf="joinForm.get('gameId')?.invalid && joinForm.get('gameId')?.touched" class="error">
        Room code is required
      </div>

      <p-inputgroup>
        <p-inputgroup-addon>
          <i class="pi pi-user"></i>
        </p-inputgroup-addon>
        <input pInputText formControlName="playerName" placeholder="Player Name" (keydown.enter)="onSubmit()" />
      </p-inputgroup>
      <div *ngIf="joinForm.get('playerName')?.invalid && joinForm.get('playerName')?.touched" class="error">
        Player name is required
      </div>

      <div *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 mt-4 justify-center">
        <p-button
          label="Back"
          icon="pi pi-arrow-left"
          (onClick)="router.navigate(['/'])"
          styleClass="p-button-secondary justify-center"
        ></p-button>
        <p-button
          label="Join"
          icon="pi pi-arrow-right"
          (onClick)="onSubmit()"
          [disabled]="joinForm.invalid || isLoading"
          class="justify-center"
        >
          <span *ngIf="isLoading">Joining...</span>
        </p-button>
      </div>
    </ng-template>
  </p-card>
</div>
