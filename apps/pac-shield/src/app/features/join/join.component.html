<div class="flex justify-center items-center h-[calc(100vh-100px)]">
  <p-card header="Join Game" styleClass="p-card-shadow w-[400px]">
    <div class="p-fluid">
      <div class="p-field">
        <label for="roomCode">Room Code</label>
        <input id="roomCode" type="text" pInputText [(ngModel)]="roomCode" />
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button
        label="Join"
        icon="pi pi-arrow-right"
        (onClick)="joinGame()"
        [loading]="isLoading"
      ></p-button>
      @if (errorMessage) {
      <div class="p-error mt-4">
        {{ errorMessage }}
      </div>
      }
    </ng-template>
  </p-card>
</div>
