<div class="game-board-container fixed top-16 left-0 right-0 bottom-0 overflow-hidden">
  <!-- Map container always present for ViewChild -->
  <div #mapContainer class="map absolute inset-0"></div>

  <!-- Hex Grid Component (invisible, manages map layers) -->
  <app-hex-grid
    (hexSelected)="onHexSelected($event)"
  ></app-hex-grid>

  <!-- Loading overlay -->
  @if (isLoading$ | async) {
    <div class="loading-overlay absolute inset-0 bg-white/90 flex flex-col items-center justify-center z-[1000]">
      <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
      <p class="mt-4 text-base md-sys-color-on-surface">Loading game data...</p>
    </div>
  }

  <!-- Error overlay -->
  @if (error$ | async; as error) {
    <div class="error-overlay absolute inset-0 bg-white/90 flex items-center justify-center z-[1000]">
      <div class="p-4 rounded-lg max-w-md text-center md-sys-bg-error-container md-sys-color-on-error-container">
        <p>Error loading game: {{ error }}</p>
      </div>
    </div>
  }

  <!-- Game info overlay (Civ-style HUD) -->
  @if (game$ | async; as game) {
    <div class="game-hud-overlay absolute top-4 left-4 right-4 z-[100] pointer-events-none">
      <div class="flex justify-between items-start">
        <!-- Left side HUD info (future expansion) -->
        <div class="game-hud-left pointer-events-auto">
          <!-- Space for future game stats, turn info, etc. -->
        </div>

        <!-- Right side HUD info -->
        <div class="game-hud-right pointer-events-auto">
          @if (selectedVisualHexCoord) {
            <div class="selected-hex-display px-3 py-2 rounded-lg md-sys-bg-surface-container md-sys-color-on-surface md-elevation-2">
              <span class="text-sm font-medium">Selected Hex: {{ selectedVisualHexCoord }}</span>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Right side panel with stubbed dashboards -->
    <div class="side-panel absolute top-2 right-2 z-[90] pointer-events-none">
      <mat-tab-group dynamicHeight="true" class="pointer-events-auto">
        <mat-tab label="Score">
          <div class="p-3">
            <app-scoreboard
              [missionPoints]="missionPoints"
              [demoralizationPoints]="demoralizationPoints"
              [resourcePoints]="resourcePoints"
              [victoryTarget]="victoryTarget"
              [gameTurn]="gameTurn"
              [gameDay]="gameDay"
              [gamePhase]="gamePhase"
            ></app-scoreboard>
          </div>
        </mat-tab>

        <mat-tab label="CAOC">
          <div class="p-3">
            <app-caoc-dashboard ></app-caoc-dashboard>
            <div class="mt-3">
              <app-ato-table [lines]="demoAtoLines" ></app-ato-table>
            </div>
          </div>
        </mat-tab>

        <mat-tab label="MOB">
          <div class="p-3">
            <app-mob-dashboard ></app-mob-dashboard>
          </div>
        </mat-tab>

        <mat-tab label="FOS">
          <div class="p-3">
            <app-fos-dashboard ></app-fos-dashboard>
          </div>
        </mat-tab>

        <mat-tab label="CSpOC">
          <div class="p-3">
            <app-cspoc-board ></app-cspoc-board>
          </div>
        </mat-tab>

        <mat-tab label="MEDCOM">
          <div class="p-3">
            <app-medcom-dashboard ></app-medcom-dashboard>
          </div>
        </mat-tab>

        <mat-tab label="Log">
          <div class="p-3">
            <app-game-log [log]="demoLog" ></app-game-log>
          </div>
        </mat-tab>
      </mat-tab-group>
    </div>
  }

  <!-- Asset palette overlay -->
  <div class="asset-palette absolute left-2 bottom-2 z-[95] pointer-events-auto">
    <div class="md-sys-bg-surface-container md-sys-color-on-surface md-shape-corner-md md-elevation-2 p-2">
      <div class="md-typescale-label-medium mb-2">Assets</div>
      <div class="flex flex-wrap gap-2 max-w-[520px]">
        @for (asset of demoAssets; track asset.id) {
          <app-game-token [asset]="asset" ></app-game-token>
        }
      </div>
    </div>
  </div>
</div>
