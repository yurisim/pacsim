<div class="space-y-4 p-2 sm:p-4">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
    <div class="text-sm font-medium text-gray-900 dark:text-gray-100">
      Airfield Tasks (16)
    </div>
    <div class="text-xs text-gray-600 dark:text-gray-400">
      {{ fosId ? (canEdit ? 'Editable' : 'Read-only') : 'Activate FOS to manage tasks' }}
    </div>
  </div>

  <!-- Error Alert -->
  <app-error-alert
    *ngIf="errorMsg"
    [variant]="'error'"
    [title]="'Tasks Error'"
    [message]="errorMsg"
    dataTestId="tasks-error"
    class="mb-4">
  </app-error-alert>

  <!-- Loading Spinner -->
  <div class="flex items-center justify-center py-8" *ngIf="isLoading">
    <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoading">
    <!-- Active FOS Content -->
    <div *ngIf="fosId; else preActivation" class="space-y-4 sm:space-y-6">
      <!-- Responsive Grid: 1 column mobile, 2 columns tablet+ -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
        <div
          *ngFor="let category of operationalCategories; trackBy: trackByCategory"
          class="bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-700
                 border border-gray-200 dark:border-gray-600 rounded-xl p-4 sm:p-6
                 transition-all duration-300 hover:shadow-lg">

          <!-- Category Header -->
          <div class="flex items-center gap-3 mb-4 sm:mb-6 pb-3 border-b border-gray-200 dark:border-gray-600">
            <div class="flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12
                        bg-blue-100 dark:bg-blue-900 rounded-lg">
              <mat-icon class="text-blue-600 dark:text-blue-400 text-xl sm:text-2xl">
                {{ category.icon }}
              </mat-icon>
            </div>
            <h3 class="text-base sm:text-lg font-semibold text-blue-800 dark:text-blue-200 uppercase tracking-wide">
              {{ category.title }}
            </h3>
          </div>

          <!-- Tasks Grid: Single column on mobile, 2x2 on larger screens -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div
              *ngFor="let task of category.tasks; trackBy: trackByTask"
              class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600
                     rounded-lg p-4 transition-all duration-200 hover:shadow-md hover:border-gray-300
                     dark:hover:border-gray-500"
              [class.ring-2]="isCompleted(task)"
              [class.ring-green-200]="isCompleted(task)"
              [class.bg-green-50]="isCompleted(task)"
              [class.dark:bg-green-900/20]="isCompleted(task)"
              [class.dark:ring-green-700]="isCompleted(task)">

              <!-- Task Content -->
              <div class="space-y-3">
                <!-- Task Title -->
                <h4 class="text-sm sm:text-base font-medium text-gray-900 dark:text-gray-100 leading-tight">
                  {{ task }}
                </h4>

                <!-- Status Chip -->
                <div class="flex justify-center">
                  <mat-chip
                    [disableRipple]="true"
                    class="text-xs px-3 py-1 rounded-full font-medium"
                    [class]="isCompleted(task)
                      ? 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200'
                      : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400'">
                    {{ isCompleted(task) ? 'Done' : 'Pending' }}
                  </mat-chip>
                </div>

                <!-- Action Button -->
                <div class="flex justify-center pt-2">
                  <button
                    mat-icon-button
                    (click)="toggle(task)"
                    [disabled]="!canToggle()"
                    [matTooltip]="canToggle() ? (isCompleted(task) ? 'Mark as not complete' : 'Mark as complete') : 'Read-only'"
                    class="w-12 h-12 sm:w-14 sm:h-14 rounded-full transition-all duration-200
                           hover:scale-110 focus:scale-110 active:scale-95
                           disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
                    [class]="isCompleted(task)
                      ? 'text-orange-600 hover:bg-orange-50 dark:text-orange-400 dark:hover:bg-orange-900/20'
                      : 'text-green-600 hover:bg-green-50 dark:text-green-400 dark:hover:bg-green-900/20'">
                    <mat-icon class="text-xl sm:text-2xl">
                      {{ isCompleted(task) ? 'undo' : 'check_circle' }}
                    </mat-icon>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pre-activation Template -->
    <ng-template #preActivation>
      <div class="text-center py-8 sm:py-12">
        <div class="text-gray-500 dark:text-gray-400 text-sm sm:text-base">
          Activate FOS to manage tasks.
        </div>
      </div>
    </ng-template>
  </div>
</div>
