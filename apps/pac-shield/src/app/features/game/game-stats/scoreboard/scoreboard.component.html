
<mat-card class="md-elevation-1 md-shape-corner-md md-sys-bg-surface-container p-2 sm:p-3 md:p-4">
  <!-- Header Section - Stacks on mobile -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
    <div class="flex items-center gap-2">
      <mat-icon class="md-sys-color-primary text-xl sm:text-2xl">leaderboard</mat-icon>
      <div class="md-typescale-title-small sm:md-typescale-title-medium">Scoreboard</div>
    </div>
    <div class="md-typescale-label-small sm:md-typescale-label-medium md-sys-color-on-surface-variant text-center sm:text-right">
      <span class="block sm:inline">Phase: {{ gamePhase }}</span>
      <span class="hidden sm:inline"> • </span>
      <span class="block sm:inline text-xs sm:text-sm">Day {{ gameDay }} • Turn {{ gameTurn }}</span>
    </div>
  </div>

  <!-- Stats Grid - Responsive columns -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3 mt-3 sm:mt-4">
    <mat-card class="md-elevation-1 p-2 sm:p-3 text-center">
      <div class="md-typescale-headline-small md-sys-color-primary text-lg sm:text-xl md:text-2xl">
        {{ missionPoints }}
      </div>
      <div class="md-typescale-body-small md-sys-color-on-surface-variant text-xs sm:text-sm">
        Mission Points
      </div>
    </mat-card>

    <mat-card class="md-elevation-1 p-2 sm:p-3 text-center">
      <div class="md-typescale-headline-small md-sys-color-error text-lg sm:text-xl md:text-2xl">
        {{ demoralizationPoints }}
      </div>
      <div class="md-typescale-body-small md-sys-color-on-surface-variant text-xs sm:text-sm">
        Demoralization
      </div>
    </mat-card>

    <mat-card class="md-elevation-1 p-2 sm:p-3 text-center">
      <div class="md-typescale-headline-small md-sys-color-tertiary text-lg sm:text-xl md:text-2xl">
        {{ resourcePoints }}
      </div>
      <div class="md-typescale-body-small md-sys-color-on-surface-variant text-xs sm:text-sm">
        Resources
      </div>
    </mat-card>
  </div>

  <mat-divider class="my-3 sm:my-4"></mat-divider>

  <!-- Victory Progress Section -->
  <div class="space-y-1">
    <div class="md-typescale-label-small sm:md-typescale-label-medium">Victory Progress</div>
    <mat-progress-bar
      [value]="victoryProgress"
      mode="determinate"
      class="md-shape-corner-full"
    />
    <div class="md-typescale-body-small md-sys-color-on-surface-variant text-xs sm:text-sm">
      {{ missionPoints }} / {{ victoryTarget }} MPs
    </div>
  </div>
</mat-card>
