<div class="flex justify-center items-center h-[calc(100vh-100px)]">
  <mat-card class="w-[450px] text-center">
    <mat-card-header class="md-padding-md md-card-header-center mb-4">
      <mat-card-title
        class="md-typescale-headline-small md-sys-color-on-surface md-card-title-center"
        >Game Master Setup</mat-card-title
      >
    </mat-card-header>
    <mat-card-content>
      <div class="flex flex-col gap-6 items-center">
        <div class="text-left">
          <mat-form-field appearance="outline">
            <mat-label
              >Last Name <span class="md-sys-color-error">*</span></mat-label
            >
            <input
              matInput
              id="lastName"
              type="text"
              [(ngModel)]="lastName"
              maxlength="50"
            />
          </mat-form-field>
        </div>

        <div class="text-center">
          <div class="flex items-center justify-center mb-4">
            <div class="md-typescale-body-medium">
              4-Digit PIN <span class="md-sys-color-error">*</span>
            </div>
            <mat-icon
              class="ml-2 cursor-pointer md-sys-color-primary"
              matTooltip="This PIN will be used to log in again in the future. You are creating it now."
              matTooltipPosition="above"
              aria-label="PIN help information"
            >
              help_outline
            </mat-icon>
          </div>
          <app-input-otp
            [length]="4"
            [integerOnly]="true"
            [(ngModel)]="pin"
            ariaLabel="4-digit PIN for Game Master"
          ></app-input-otp>
          <!-- (complete)="onPinComplete($event)" -->
        </div>

      </div>
    </mat-card-content>

    <mat-card-actions class="flex gap-3 md-padding-lg justify-center mt-4">
      <button
        matButton="tonal"
        (click)="onBack()"
      >
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
        <span class="md-typescale-label-large">Back</span>
      </button>

      <button
        matButton="filled"
        color="primary"
        (click)="onSubmit()"
        [disabled]="!isFormValid"
      >
        <span class="">Continue</span>
        <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
