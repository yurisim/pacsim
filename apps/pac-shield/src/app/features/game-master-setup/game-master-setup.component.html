<div class="flex justify-center items-center h-[calc(100vh-100px)]">
  <mat-card class="w-[450px] text-center">
    <mat-card-header>
      <mat-card-title>Game Master Setup</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="flex flex-col gap-6">
        <div class="text-left">
          <label for="lastName" class="block text-sm font-medium mb-2">
            Last Name <span class="text-red-500">*</span>
          </label>
          <mat-form-field appearance="outline" class="w-full">
            <input
              matInput
              id="lastName"
              type="text"
              [(ngModel)]="lastName"
              placeholder="Enter your last name"
              maxlength="50"
            />
          </mat-form-field>
        </div>

        <div class="text-left">
          <label for="pin" class="block text-sm font-medium mb-2">
            4-Digit PIN <span class="text-red-500">*</span>
          </label>
          <mat-form-field appearance="outline" class="w-full">
            <input
              matInput
              id="pin"
              type="text"
              [(ngModel)]="pin"
              placeholder="Enter PIN"
              maxlength="4"
              inputmode="numeric"
              pattern="[0-9]*"
            />
          </mat-form-field>
        </div>

        <button
          mat-raised-button
          color="primary"
          (click)="onSubmit()"
          [disabled]="!isFormValid"
          class="w-full"
        >
          Continue
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
