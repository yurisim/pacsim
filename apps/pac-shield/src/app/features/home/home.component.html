@if (showGameMasterSetup) {
<app-game-master-setup
  (complete)="onGameMasterSetupComplete($event)"
  (back)="onGameMasterSetupBack()"
></app-game-master-setup>
} @else {
<div
  class="md-sys-bg-background min-h-[calc(100vh-100px)] flex justify-center items-center md-padding-lg"
>
  <mat-card
    class="w-fit text-center md-sys-bg-surface-container md-shape-corner-lg md-elevation-2"
  >
    <mat-card-header class="md-card-header-center mb-3">
      <mat-card-title
        class="md-typescale-headline-small md-sys-color-on-surface md-card-title-center"
      >
        OPERATION: PACIFIC SHIELD
      </mat-card-title>
    </mat-card-header>
    <mat-card-content class="md-padding-lg">
      @if (isAuthenticated) {
      <div class="flex flex-col gap-4 items-center mb-6">
        <div class="text-center">
          <div class="md-typescale-title-medium md-sys-color-on-surface mb-2">
            Welcome back, {{ currentPlayerName }}!
          </div>
          <div class="md-typescale-body-medium md-sys-color-on-surface-variant">
            Continue your game session
          </div>
        </div>
        <button
          matButton="filled"
          (click)="continueGameSession()"
          [disabled]="(websocketService.connectionStatus$ | async) === false"
        >
          Continue Session
        </button>
      </div>
      }

      <div class="flex flex-col gap-4 items-center">
        <button
          matButton="filled"
          (click)="createGame()"
          [disabled]="isLoading || (websocketService.connectionStatus$ | async) === false"
        >
          <span *ngIf="!isLoading">Start New Game</span>
          <span *ngIf="isLoading">Starting...</span>
        </button>
        <button
          matButton="tonal"
          (click)="navigateToJoin()"
          [disabled]="(websocketService.connectionStatus$ | async) === false"
        >
          Join Game
        </button>
      </div>

      @if (errorMessage) {
      <div
        class="mt-4 md-typescale-body-small md-sys-color-on-error-container md-padding-sm md-sys-bg-error-container md-shape-corner-sm"
      >
        {{ errorMessage }}
      </div>
      }
    </mat-card-content>
  </mat-card>
</div>
}
