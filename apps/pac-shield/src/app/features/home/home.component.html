@if (showGameMasterSetup) {
  <app-game-master-setup
    (complete)="onGameMasterSetupComplete($event)"
  ></app-game-master-setup>
} @else {
  <div class="flex justify-center items-center h-[calc(100vh-100px)]">
    <mat-card class="w-[450px] text-center">
      <mat-card-header>
        <mat-card-title>OPERATION: PACIFIC SHIELD</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="flex flex-col gap-4">
          <button mat-raised-button color="primary" (click)="createGame()" [disabled]="isLoading">
            <span *ngIf="!isLoading">Start New Game</span>
            <span *ngIf="isLoading">Starting...</span>
          </button>
          <button mat-stroked-button color="accent" (click)="navigateToJoin()">
            Join Game
          </button>
        </div>

        @if (errorMessage) {
        <div class="mt-4 text-red-600">
          {{ errorMessage }}
        </div>
        }
      </mat-card-content>
    </mat-card>
  </div>
}
