<p-toast></p-toast>

@if (showGameMasterSetup) {
  <app-game-master-setup
    (complete)="onGameMasterSetupComplete($event)"
  ></app-game-master-setup>
} @else {
  <div class="flex justify-center items-center h-[calc(100vh-100px)]">
    <p-card header="OPERATION: PACIFIC SHIELD" class="w-[450px] text-center">
      <div class="flex flex-col gap-4">
        <p-button
          label="Start New Game"
          (onClick)="createGame()"
          [loading]="isLoading"
        ></p-button>
        <p-button
          label="Join Game"
          styleClass="p-button-secondary"
          (onClick)="navigateToJoin()"
        ></p-button>
      </div>

      @if (errorMessage) {
      <div class="p-error mt-4">
        {{ errorMessage }}
      </div>
      }
    </p-card>
  </div>
}
