@if (showGameMasterSetup) {
<app-game-master-setup
  (complete)="onGameMasterSetupComplete($event)"
></app-game-master-setup>
} @else {
<div
  class="md-sys-bg-background min-h-[calc(100vh-100px)] flex justify-center items-center md-padding-lg"
>
  <mat-card
    class="w-[450px] text-center md-sys-bg-surface-container md-shape-corner-lg md-elevation-2"
  >
    <mat-card-header class="md-padding-md md-card-header-center mb-3">
      <mat-card-title
        class="md-typescale-headline-small md-sys-color-on-surface md-card-title-center"
        >OPERATION: PACIFIC SHIELD</mat-card-title
      >
    </mat-card-header>
    <mat-card-content class="md-padding-lg">
      <div class="flex flex-col gap-4 items-center">
        <button
          matButton="filled"
          (click)="createGame()"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Start New Game</span>
          <span *ngIf="isLoading">Starting...</span>
        </button>
        <button matButton="tonal" (click)="navigateToJoin()">Join Game</button>
      </div>

      @if (errorMessage) {
      <div
        class="mt-4 md-typescale-body-small md-sys-color-on-error-container md-padding-sm md-sys-bg-error-container md-shape-corner-sm"
      >
        {{ errorMessage }}
      </div>
      }
    </mat-card-content>
  </mat-card>
</div>
}
