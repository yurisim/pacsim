<p-toast></p-toast>
<div class="flex justify-center items-center h-[calc(100vh-100px)]">
  <p-card header="PACSIM" styleClass="p-card-shadow w-[450px] text-center">
    <div class="flex flex-col gap-4 mb-8">
      <p-button
        label="Start New Game"
        (onClick)="createGame()"
        [loading]="isLoading"
      ></p-button>
      <p-button
        label="Join Game"
        styleClass="p-button-secondary"
        (onClick)="navigateToJoin()"
      ></p-button>
    </div>

    @if (errorMessage) {
    <div class="p-error mt-4">
      {{ errorMessage }}
    </div>
    }
  </p-card>
</div>
