@if (visible()) {
  <div class="w-[90%] max-w-[480px] mx-0 md-sys-bg-surface-container md-elevation-2 md-shape-corner-lg">
    <div class="px-6 py-4">
      <h2 id="playerSettingsTitle" class="md-typescale-title-medium md-sys-color-on-surface m-0">Player Settings</h2>
    </div>

    <div class="px-6 py-5">
      <div class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Name</mat-label>
          <input matInput id="playerName" type="text" [(ngModel)]="name" placeholder="Enter your name" maxlength="50" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Select a role</mat-label>
          <mat-select id="playerRole" [(ngModel)]="role">
            <mat-option [value]="null">Select a role</mat-option>
            @for (opt of roleOptions; track opt) {
              <mat-option [value]="opt">{{ opt }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="px-6 py-4 flex justify-end gap-2">
      <button matButton="outlined" type="button" (click)="cancelSettings()" class="">
        Cancel
      </button>
      <button matButton="filled" color="primary" type="button" (click)="saveSettings()" [disabled]="!isFormValid" class="">
        Save
      </button>
    </div>
  </div>
}
