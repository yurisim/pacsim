@if (visible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50"></div>

    <div class="relative bg-white dark:bg-neutral-900 rounded-lg shadow-xl w-[90%] max-w-[480px] mx-4">
      <div class="px-6 py-4 border-b border-neutral-200 dark:border-neutral-800">
        <h2 class="text-lg font-semibold">Player Settings</h2>
      </div>

      <div class="px-6 py-5">
        <div class="flex flex-col gap-4">
          <div>
            <label for="playerName" class="block text-sm font-medium mb-2">
              Name <span class="text-red-500">*</span>
            </label>
            <input
              id="playerName"
              type="text"
              [(ngModel)]="name"
              placeholder="Enter your name"
              maxlength="50"
              class="w-full rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="playerRole" class="block text-sm font-medium mb-2">
              Role
            </label>
            <select
              id="playerRole"
              [(ngModel)]="role"
              class="w-full rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option [ngValue]="null">Select a role</option>
              @for (opt of roleOptions; track opt) {
                <option [ngValue]="opt">{{ opt }}</option>
              }
            </select>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-neutral-200 dark:border-neutral-800 flex justify-end gap-2">
        <button
          type="button"
          (click)="cancelSettings()"
          class="px-4 py-2 rounded border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-50 dark:hover:bg-neutral-800"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="saveSettings()"
          [disabled]="!isFormValid"
          class="px-4 py-2 rounded bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-700"
        >
          Save
        </button>
      </div>
    </div>
  </div>
}
