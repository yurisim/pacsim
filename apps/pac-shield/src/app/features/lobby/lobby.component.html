@if (game$ | async; as game) {
<div
  class="min-h-[calc(100vh-64px)] p-6"
  style="
    background-color: var(--mat-sys-surface);
    color: var(--mat-sys-on-surface);
  "
>
  <div class="flex flex-col items-center max-w-7xl mx-auto">
    <h1
      class="text-4xl font-bold mb-6"
      style="color: var(--mat-sys-on-surface)"
    >
      Game Lobby
    </h1>

    <!-- Room Code Section -->
    <app-room-code-display [roomCode]="game.roomCode"></app-room-code-display>

    <p class="md-typescale-body-large md-sys-color-on-surface-variant mb-4">
      Game ID:
      <span class="font-mono md-sys-color-secondary">{{ game.id }}</span>
    </p>

    <!-- Map Navigation Button -->
    <button 
      mat-raised-button 
      color="primary"
      class="mb-8"
      (click)="navigateToMap()"
    >
      <mat-icon>map</mat-icon>
      View Pacific Map
    </button>

    <!-- Current Player Actions Card -->
    <app-current-player-actions
      [currentPlayer]="(currentPlayer$ | async) || undefined"
      (editProfile)="openPlayerSettings()"
      (leaveTeam)="leaveCurrentTeam()"
    ></app-current-player-actions>

    <!-- Tabbed Interface -->
    <mat-card class="w-full md-elevation-1 md-sys-bg-surface-container">
      <mat-tab-group [(selectedIndex)]="activeTabIndex" class="w-full">
        <!-- Overview Tab -->
        <mat-tab label="Overview">
          <app-overview-tab
            [teams]="game.teams || []"
            [currentPlayer]="(currentPlayer$ | async) || undefined"
            [totalPlayers]="totalPlayers(game)"
            [unassignedCount]="unassignedCount(game)"
            [teamsMissingCommander]="teamsMissingCommander(game)"
            [getTeamTypeInfo]="getTeamTypeInfo"
            (joinTeam)="openJoinTeamDialog($event)"
          ></app-overview-tab>
        </mat-tab>

        <!-- Teams Tab -->
        <mat-tab label="Teams">
          <app-teams-tab
            [allTeams]="game.teams || []"
            [currentPlayer]="(currentPlayer$ | async) || undefined"
            [showGMTools]="isCurrentPlayerGM(game)"
            [unassignedCount]="unassignedCount(game)"
            [filters]="filters"
            [getTeamTypeInfo]="getTeamTypeInfo"
            [groupPlayersByRole]="groupPlayersByRole"
            (filtersChange)="onFiltersChange($event)"
            (joinTeam)="openJoinTeamDialog($event)"
            (assignOneUnassigned)="assignOneUnassigned($event)"
            (toggleTeamLock)="onToggleTeamLock($event)"
            (changeRole)="onPlayerChangeRole($event)"
            (moveToTeam)="onPlayerMoveToTeam($event)"
            (removeFromTeam)="onRemoveFromTeam($event)"
            (removeFromGame)="onRemoveFromGame($event)"
          ></app-teams-tab>
        </mat-tab>

        <!-- Unassigned Tab -->
        <mat-tab label="Unassigned">
          <app-unassigned-tab
            [filteredUnassignedPlayers]="filteredUnassigned(game)"
            [allTeams]="game.teams || []"
            [showGMTools]="isCurrentPlayerGM(game)"
            [filters]="filters"
            (filtersChange)="onFiltersChange($event)"
            (changeRole)="onPlayerChangeRole($event)"
            (moveToTeam)="onPlayerMoveToTeam($event)"
            (removeFromTeam)="onRemoveFromTeam($event)"
            (removeFromGame)="onRemoveFromGame($event)"
          ></app-unassigned-tab>
        </mat-tab>

        <!-- Players Tab -->
        <mat-tab label="Players">
          <app-all-players-tab
            [filteredPlayers]="filteredPlayers(game)"
            [allTeams]="game.teams || []"
            [showGMTools]="isCurrentPlayerGM(game)"
            [filters]="filters"
            (filtersChange)="onFiltersChange($event)"
            (changeRole)="onPlayerChangeRole($event)"
            (moveToTeam)="onPlayerMoveToTeam($event)"
            (removeFromTeam)="onRemoveFromTeam($event)"
            (removeFromGame)="onRemoveFromGame($event)"
          ></app-all-players-tab>
        </mat-tab>
      </mat-tab-group>
    </mat-card>
  </div>
</div>

<!-- GM Player Context Menus -->
<app-gm-player-menus
  [playerRoles]="playerRoles"
  [getTeamTypeInfo]="getTeamTypeInfo"
  (changeRole)="onChangeRole($event)"
  (moveToTeam)="onMoveToTeam($event)"
  (removeFromTeam)="onRemoveFromTeam($event)"
  (removeFromGame)="onRemoveFromGame($event)"
></app-gm-player-menus>

}
