<mat-toolbar class="flex justify-between">
  <div class="flex items-center">
    <mat-icon fontIcon="security" class="mr-3 text-primary" aria-hidden="true"></mat-icon>
    <h1 class="app-title text-primary font-bold text-2xl">
      <span class="hidden sm:inline">{{ title }}</span>
      <span class="sm:hidden">OPS</span>
    </h1>
  </div>
  <div>
    <div class="flex items-center gap-4">
      @if (ws.connectionStatus$ | async) {
        <div class="flex items-center text-green-500">
          <mat-icon fontIcon="wifi" class="mr-2" aria-hidden="true"></mat-icon>
          <span>Connected</span>
        </div>
      } @else {
        <div class="flex items-center text-red-500">
          <mat-icon fontIcon="signal_wifi_off" class="mr-2" aria-hidden="true"></mat-icon>
          <span>Disconnected</span>
        </div>
      }
      <button mat-icon-button routerLink="/" aria-label="Home">
        <mat-icon fontIcon="home" aria-hidden="true"></mat-icon>
      </button>
      @if (auth.isAuthenticated() && auth.getGameId()) {
        <button mat-raised-button color="warn" (click)="onLogout()">
          <mat-icon fontIcon="logout" class="mr-2" aria-hidden="true"></mat-icon>
          Logout
        </button>
      }
    </div>
  </div>
</mat-toolbar>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
