<p-toolbar>
  <div class="p-toolbar-group-start flex items-center">
    <i class="mi mi-2xl mr-3 text-primary">security</i>
    <h1 class="app-title text-primary font-bold text-2xl">
      <span class="hidden sm:inline">{{ title }}</span>
      <span class="sm:hidden">OPS</span>
    </h1>
  </div>
  <div class="p-toolbar-group-end">
    <div class="flex items-center gap-4">
      <p-button
        icon="pi pi-home"
        styleClass="p-button-secondary"
        routerLink="/"
      ></p-button>
      @if (ws.connectionStatus$ | async) {
      <div class="flex items-center text-green-500">
        <i class="pi pi-wifi mr-2"></i>
        <span>Connected</span>
      </div>
      } @else {
      <div class="flex items-center text-red-500">
        <i class="pi pi-times mr-2"></i>
        <span>Disconnected</span>
      </div>
      }
    </div>
  </div>
</p-toolbar>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
