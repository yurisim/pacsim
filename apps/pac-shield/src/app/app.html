<mat-toolbar class="app-toolbar" role="banner">
  <div class="flex items-center gap-3">
    <mat-icon class="md-sys-color-primary" aria-hidden="true"
      >security</mat-icon
    >
    <div class="flex items-center gap-2">
      <h1 class="text-xl font-medium m-0 md-sys-color-on-surface">
        <span class="hidden sm:inline">{{ title }}</span>
        <span class="sm:hidden">OPS</span>
      </h1>
      @if (currentGameId) {
      <!-- Mobile Menu (small screens) -->
      <div class="flex md:hidden ml-4">
        <button
          matIconButton
          [matMenuTriggerFor]="navigationMenu"
          aria-label="Navigation menu"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #navigationMenu="matMenu">
          <button mat-menu-item (click)="navigateToLobby()">
            <mat-icon>groups</mat-icon>
            <span>Lobby</span>
          </button>
          <button mat-menu-item (click)="navigateToMap()">
            <mat-icon>map</mat-icon>
            <span>Map</span>
          </button>
        </mat-menu>
      </div>

      <!-- Desktop Buttons (medium+ screens) -->
      <div class="hidden md:flex items-center gap-2 ml-4">
        <button
          matButton="tonal"
          color="primary"
          (click)="navigateToLobby()"
          class="text-sm"
        >
          Lobby
        </button>
        <button
          matButton="tonal"
          color="primary"
          (click)="navigateToMap()"
          class="text-sm"
        >
          Map
        </button>
      </div>
      }
    </div>
  </div>

  <span class="toolbar-spacer"></span>

  <div class="flex items-center gap-2">
    <!-- Connection Status -->
    @if (ws.connectionStatus$ | async) {
    <div class="flex items-center gap-2 md-sys-color-tertiary">
      <mat-icon aria-hidden="true">wifi</mat-icon>
      <span class="text-sm hidden md:inline">Connected</span>
    </div>
    } @else {
    <div class="flex items-center gap-2 md-sys-color-error">
      <mat-icon aria-hidden="true">signal_wifi_off</mat-icon>
      <span class="text-sm hidden md:inline">Disconnected</span>
    </div>
    }

    <!-- Home Button -->
    <button
      matIconButton
      routerLink="/"
      aria-label="Navigate to home page"
      matTooltip="Home"
    >
      <mat-icon>home</mat-icon>
    </button>

    <!-- Theme Toggle Button -->
    <app-theme-toggle></app-theme-toggle>

    <!-- Logout Button -->
    @if (auth.isAuthenticated() && auth.getGameId()) {
    <button
      matButton="filled"
      color="warn"
      (click)="onLogout()"
      class="md:ml-2"
      aria-label="Logout from current game"
    >
      <mat-icon>logout</mat-icon>
      <span class="hidden md:inline">Logout</span>
    </button>
    }
  </div>
</mat-toolbar>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
