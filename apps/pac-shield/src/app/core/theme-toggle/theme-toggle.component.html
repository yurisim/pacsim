<!-- In your component template -->
<button
  matIconButton
  (click)="toggleTheme()"
  [attr.aria-label]="
    themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'
  "
  [title]="
    themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'
  "
>
  @if (themeService.isDarkMode()) {
  <mat-icon>light_mode</mat-icon>
  } @else {
  <mat-icon>dark_mode</mat-icon>
  }
</button>
