<div class="otp-container" role="group" [attr.aria-label]="ariaLabel">
  <input
    #otpInput
    *ngFor="let value of values; let i = index; trackBy: trackByIndex"
    class="otp-input md-sys-bg-surface-container md-sys-color-on-surface"
    [type]="mask ? 'password' : 'text'"
    [value]="values[i]"
    [readonly]="disabled"
    [placeholder]="placeholder"
    [attr.data-otp-index]="i"
    [attr.aria-label]="ariaLabel + ' digit ' + (i + 1)"
    maxlength="1"
    autocomplete="off"
    (input)="onInputChange($event, i)"
    (keydown)="onInputKeyDown($event, i)"
    (keydown.enter)="$event.preventDefault()"
    (paste)="onInputPaste($event, i)"
    (focus)="onInputFocus()"
  />
</div>
