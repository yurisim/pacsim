name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.44.0-jammy
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pacsim
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: adminpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Set NX_BASE and NX_HEAD environment variables
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
            echo "NX_HEAD=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
            echo "NX_BASE=${{ github.event.before }}" >> $GITHUB_ENV
            echo "NX_HEAD=${{ github.sha }}" >> $GITHUB_ENV
          fi
      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: yarn nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'



      - run: yarn install --frozen-lockfile

      - run: npx prisma db push --schema apps/pac-shield-api/src/prisma/schema.prisma --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:adminpass@postgres:5432/pacsim

      - name: Start backend API
        run: yarn nx serve pac-shield-api &

      - name: Run affected E2E tests
        run: yarn nx affected -t lint test build e2e
        env:
          DATABASE_URL: postgresql://postgres:adminpass@postgres:5432/pacsim
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: yarn nx fix-ci
        if: always()
